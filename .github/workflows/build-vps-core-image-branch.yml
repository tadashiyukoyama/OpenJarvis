name: Build VPS Core image (deployment branch)

on:
  push:
    branches:
      - codex/deploy-main-fix
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'deploy/vps/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-vps-core-image-branch.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: openjarvis-vps-core-image-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openjarvis-codex-vps:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=openjarvis-vps-core-branch
          cache-to: type=gha,mode=max,scope=openjarvis-vps-core-branch

      - name: Record immutable artifact
        run: |
          set -euo pipefail
          test -n "${{ steps.image.outputs.digest }}"
          {
            echo "Image: ghcr.io/${{ github.repository_owner }}/openjarvis-codex-vps:${GITHUB_SHA}"
            echo "Digest: ${{ steps.image.outputs.digest }}"
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
