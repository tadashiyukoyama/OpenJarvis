name: Build immutable VPS Core image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'deploy/vps/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-vps-core-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: openjarvis-vps-core-image
  cancel-in-progress: false

jobs:
  build:
    # The immutable image build runs on an ephemeral GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          push: true
          tags: ghcr.io/cesaryukoyama28-eng/openjarvis-codex:${{ github.sha }}
          cache-from: type=gha,scope=openjarvis-vps-core
          cache-to: type=gha,mode=max,scope=openjarvis-vps-core

      - name: Record immutable artifact
        run: |
          set -euo pipefail
          test -n "${{ steps.image.outputs.digest }}"
          echo "Image: ghcr.io/cesaryukoyama28-eng/openjarvis-codex:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
