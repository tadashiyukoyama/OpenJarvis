name: Build immutable VPS Core image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'deploy/vps/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-vps-core-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: openjarvis-vps-core-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, openjarvis-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Validate dedicated runner boundary
        env:
          EXPECTED_RUNNER_NAME: vps10056-openjarvis
          MIN_FREE_GIB: '8'
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          security_options=$(docker info --format '{{json .SecurityOptions}}')
          [[ "$security_options" == *rootless* ]]
          free_gib=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          (( free_gib >= MIN_FREE_GIB ))
          echo "Dedicated runner verified with ${free_gib} GiB free." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          push: true
          tags: ghcr.io/cesaryukoyama28-eng/openjarvis-codex:${{ github.sha }}
          cache-from: type=gha,scope=openjarvis-vps-core
          cache-to: type=gha,mode=max,scope=openjarvis-vps-core

      - name: Record immutable artifact
        run: |
          set -euo pipefail
          test -n "${{ steps.image.outputs.digest }}"
          echo "Image: ghcr.io/cesaryukoyama28-eng/openjarvis-codex:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
