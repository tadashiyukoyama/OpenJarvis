# No secret is stored here. The PowerShell wrapper reads a private D: env file.
[mcp_servers.openjarvis_agent]
command = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
args = [
  "-NoLogo",
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "D:\\dev\\workspaces\\openjarvis\\scripts\\edge\\Start-OpenJarvisAgentMcp.ps1"
]
startup_timeout_sec = 20
tool_timeout_sec = 330
